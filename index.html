<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Контакты</title>
</head>
<body>
  <form id="form">
    <input id="name"    placeholder="Имя"     required />
    <input id="email"   placeholder="Email"   type="email" required />
    <textarea id="msg"  placeholder="Сообщение" required></textarea>
    <button type="submit">Отправить</button>
    <p id="status"></p>
  </form>

  <script>
    // URL твоего Worker'а (вида https://my-worker.username.workers.dev)
    const WORKER_URL = 'https://YOUR_WORKER.workers.dev';

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      status.textContent = 'Отправляю...';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name:    document.getElementById('name').value,
            email:   document.getElementById('email').value,
            message: document.getElementById('msg').value,
          })
        });
        const data = await res.json();
        status.textContent = data.ok ? '✅ Отправлено!' : '❌ Ошибка';
      } catch {
        status.textContent = '❌ Ошибка сети';
      }
    });
  </script>
</body>
</html>
